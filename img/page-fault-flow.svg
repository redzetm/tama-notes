<svg xmlns="http://www.w3.org/2000/svg" width="980" height="790" viewBox="0 0 980 790">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
    <style>
      .title {
        font-family: "Noto Sans CJK JP", "Hiragino Sans", sans-serif;
        font-size: 28px;
        font-weight: 700;
        fill: #222222;
      }
      .box {
        fill: #fafafa;
        stroke: #333333;
        stroke-width: 2;
        rx: 10;
        ry: 10;
        filter: url(#shadow);
      }
      .cpu { fill: #eaf4ff; stroke: #2d5f9a; }
      .mmu { fill: #f6edff; stroke: #7040a0; }
      .fault { fill: #fdeaea; stroke: #a04545; }
      .kernel { fill: #eef8ea; stroke: #507d32; }
      .retry { fill: #fff7dd; stroke: #9a6a2d; }
      .label {
        font-family: "Noto Sans CJK JP", "Hiragino Sans", sans-serif;
        font-size: 22px;
        fill: #222222;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .small {
        font-size: 18px;
      }
      .note {
        font-family: "Noto Sans CJK JP", "Hiragino Sans", sans-serif;
        font-size: 17px;
        fill: #333333;
      }
      .line {
        stroke: #444444;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect x="1" y="1" width="978" height="788" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>

  <text class="title" x="38" y="42">ページフォルト発生から再実行までの流れ</text>

  <rect class="box cpu" x="170" y="80" width="620" height="72"/>
  <text class="label" x="480" y="108">CPU が仮想アドレス 0x12345678 へアクセス</text>
  <text class="label small" x="480" y="132">まだ対応する物理ページがあるとは限らない</text>

  <line class="line" x1="480" y1="152" x2="480" y2="188"/>

  <rect class="box mmu" x="200" y="188" width="560" height="72"/>
  <text class="label" x="480" y="216">MMU がページテーブルを参照</text>
  <text class="label small" x="480" y="240">変換可能か、権限違反がないかを確認する</text>

  <line class="line" x1="480" y1="260" x2="480" y2="296"/>

  <rect class="box fault" x="220" y="296" width="520" height="72"/>
  <text class="label" x="480" y="324">対応する物理ページが無い</text>
  <text class="label small" x="480" y="348">そこでページフォルト例外が発生する</text>

  <line class="line" x1="480" y1="368" x2="480" y2="404"/>

  <rect class="box kernel" x="210" y="404" width="540" height="72"/>
  <text class="label" x="480" y="432">カーネルのページフォルト処理へ入る</text>
  <text class="label small" x="480" y="456">原因を調べ、割り当て可能かを判断する</text>

  <line class="line" x1="480" y1="476" x2="480" y2="512"/>

  <rect class="box kernel" x="210" y="512" width="540" height="72"/>
  <text class="label" x="480" y="540">物理メモリを確保する</text>
  <text class="label small" x="480" y="564">必要ならページを初期化し、実体を用意する</text>

  <line class="line" x1="480" y1="584" x2="480" y2="620"/>

  <rect class="box kernel" x="210" y="620" width="540" height="72"/>
  <text class="label" x="480" y="648">ページテーブルを更新する</text>
  <text class="label small" x="480" y="672">仮想ページと物理ページを結び付ける</text>

  <line class="line" x1="480" y1="692" x2="480" y2="728"/>

  <rect class="box retry" x="180" y="728" width="600" height="44"/>
  <text class="label small" x="480" y="750">元の命令が再実行され、今度は変換できる</text>
</svg>