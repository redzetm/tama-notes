<svg xmlns="http://www.w3.org/2000/svg" width="980" height="850" viewBox="0 0 980 850">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
    <style>
      .title { font-family: sans-serif; font-size: 28px; font-weight: 700; fill: #222; }
      .box { stroke: #333; stroke-width: 2; rx: 10; ry: 10; }
      .cpu { fill: #eaf4ff; stroke: #2d5f9a; }
      .mmu { fill: #f6edff; stroke: #7040a0; }
      .kernel { fill: #eef8ea; stroke: #507d32; }
      .retry { fill: #fff7dd; stroke: #9a6a2d; }
      .error { fill: #fdeaea; stroke: #a04545; }
      .label { font-family: sans-serif; font-size: 21px; fill: #222; text-anchor: middle; dominant-baseline: middle; }
      .small { font-size: 17px; }
      .branch { font-family: sans-serif; font-size: 17px; font-weight: 700; fill: #333; }
      .line { stroke: #444; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="978" height="848" fill="#fff" stroke="#ccc" stroke-width="2"/>
  <text class="title" x="40" y="45">ページフォルトの確認と処理</text>

  <rect class="box cpu" x="170" y="80" width="640" height="82"/>
  <text class="label" x="490" y="108">CPU が仮想アドレスへアクセス</text>
  <text class="label small" x="490" y="137">TLB miss 時は hardware page-table walk を行う</text>
  <path class="line" d="M490 162 V195"/>

  <rect class="box mmu" x="190" y="195" width="600" height="92"/>
  <text class="label" x="490" y="226">変換またはアクセス権の検査に失敗</text>
  <text class="label small" x="490" y="257">未mapping、権限違反などで page-fault exception</text>
  <path class="line" d="M490 287 V320"/>

  <rect class="box kernel" x="190" y="320" width="600" height="100"/>
  <text class="label" x="490" y="351">カーネルがfault addressとアクセス種別を確認</text>
  <text class="label small" x="490" y="383">VMA、既存mapping、必要な操作を調べる</text>
  <path class="line" d="M490 420 V456 H255 V490"/>
  <path class="line" d="M490 456 H725 V490"/>
  <text class="branch" x="278" y="480">解決可能</text>
  <text class="branch" x="748" y="480">解決不可</text>

  <rect class="box kernel" x="55" y="490" width="400" height="112"/>
  <text class="label" x="255" y="522">mapping を解決</text>
  <text class="label small" x="255" y="552">zero page、file page、COW など</text>
  <text class="label small" x="255" y="578">page table を更新する</text>
  <path class="line" d="M255 602 V658"/>

  <rect class="box retry" x="75" y="658" width="360" height="82"/>
  <text class="label" x="255" y="687">必要な整合性処理後、</text>
  <text class="label small" x="255" y="716">元の命令を再実行</text>

  <rect class="box error" x="525" y="490" width="400" height="112"/>
  <text class="label" x="725" y="522">mapping を解決できない</text>
  <text class="label small" x="725" y="552">無効な参照や許可されないアクセス</text>
  <text class="label small" x="725" y="578">signal などのエラー処理へ</text>

  <text class="label small" x="490" y="798">すべての page fault が物理 page の割り当てや再実行に至るわけではない</text>
</svg>
