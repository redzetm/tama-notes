<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
    <style>
      .title {
        font-family: "Noto Sans CJK JP", "Hiragino Sans", sans-serif;
        font-size: 26px;
        font-weight: 700;
        fill: #222222;
      }
      .panel {
        fill: #ffffff;
        stroke: #333333;
        stroke-width: 2;
        rx: 12;
        ry: 12;
        filter: url(#shadow);
      }
      .virt {
        fill: #eaf4ff;
        stroke: #2d5f9a;
        stroke-width: 2;
        rx: 8;
        ry: 8;
      }
      .phys {
        fill: #fff4df;
        stroke: #9a6a2d;
        stroke-width: 2;
        rx: 8;
        ry: 8;
      }
      .table {
        fill: #eef8ea;
        stroke: #4b7a31;
        stroke-width: 2;
        rx: 10;
        ry: 10;
      }
      .label {
        font-family: "Noto Sans CJK JP", "Hiragino Sans", sans-serif;
        font-size: 20px;
        fill: #222222;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .small {
        font-size: 17px;
      }
      .tiny {
        font-size: 15px;
      }
      .note {
        font-family: "Noto Sans CJK JP", "Hiragino Sans", sans-serif;
        font-size: 17px;
        fill: #333333;
      }
      .line {
        stroke: #444444;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
      }
      .dash {
        stroke-dasharray: 8 7;
      }
    </style>
  </defs>

  <rect x="1" y="1" width="978" height="558" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>
  <text class="title" x="36" y="42">ページとページフレームの関係</text>

  <rect class="panel" x="50" y="90" width="270" height="330"/>
  <text class="label" x="185" y="120">仮想アドレス空間側</text>
  <text class="label tiny" x="185" y="145">プロセスに見えている単位がページ</text>

  <rect class="virt" x="100" y="180" width="170" height="54"/>
  <text class="label" x="185" y="207">仮想ページ 0</text>

  <rect class="virt" x="100" y="238" width="170" height="54"/>
  <text class="label" x="185" y="265">仮想ページ 1</text>

  <rect class="virt" x="100" y="296" width="170" height="54"/>
  <text class="label" x="185" y="323">仮想ページ 2</text>

  <rect class="virt" x="100" y="354" width="170" height="54"/>
  <text class="label" x="185" y="381">仮想ページ 3</text>

  <rect class="table" x="395" y="200" width="190" height="110"/>
  <text class="label" x="490" y="230">ページテーブル</text>
  <text class="label small" x="490" y="262">どの仮想ページを</text>
  <text class="label small" x="490" y="288">どのページフレームへ</text>
  <text class="label small" x="490" y="314">結び付けるかを記録</text>

  <rect class="panel" x="660" y="90" width="270" height="330"/>
  <text class="label" x="795" y="120">物理メモリ側</text>
  <text class="label tiny" x="795" y="145">実際の RAM の単位がページフレーム</text>

  <rect class="phys" x="710" y="180" width="170" height="54"/>
  <text class="label" x="795" y="207">ページフレーム 12</text>

  <rect class="phys" x="710" y="238" width="170" height="54"/>
  <text class="label" x="795" y="265">ページフレーム 44</text>

  <rect class="phys" x="710" y="296" width="170" height="54"/>
  <text class="label" x="795" y="323">ページフレーム 3</text>

  <rect class="phys" x="710" y="354" width="170" height="54"/>
  <text class="label" x="795" y="381">ページフレーム 98</text>

  <line class="line" x1="270" y1="207" x2="710" y2="323"/>
  <line class="line" x1="270" y1="265" x2="710" y2="207"/>
  <line class="line" x1="270" y1="323" x2="710" y2="265"/>
  <line class="line" x1="270" y1="381" x2="710" y2="381"/>

  <text class="note" x="52" y="470">左のページは「見えている区切り」、右のページフレームは「実際に置かれる区切り」です。</text>
  <text class="note" x="52" y="500">両者は同じサイズ単位で対応するが、番号や並び方は一致しなくてよいのが重要です。</text>
  <text class="note" x="52" y="530">Linux はこの対応関係をページテーブルで管理し、MMU がアクセス時に解釈します。</text>
</svg>