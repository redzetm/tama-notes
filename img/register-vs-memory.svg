<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="860" viewBox="0 0 1080 860">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444444"/>
    </marker>
    <style>
      .title {
        font-family: "Noto Sans CJK JP", "Hiragino Sans", sans-serif;
        font-size: 28px;
        font-weight: 700;
        fill: #222222;
      }
      .subtitle {
        font-family: "Noto Sans CJK JP", "Hiragino Sans", sans-serif;
        font-size: 17px;
        fill: #555555;
      }
      .box {
        fill: #fafafa;
        stroke: #333333;
        stroke-width: 2;
        rx: 14;
        ry: 14;
        filter: url(#shadow);
      }
      .panel {
        fill: #fcfcfc;
        stroke: #d0d0d0;
        stroke-width: 2;
        rx: 18;
        ry: 18;
      }
      .cpu {
        fill: #eaf4ff;
        stroke: #2d5f9a;
      }
      .reg {
        fill: #eef8ea;
        stroke: #4b7a31;
      }
      .mem {
        fill: #fff4df;
        stroke: #9a6a2d;
      }
      .smallbox {
        fill: #ffffff;
        stroke: #555555;
        stroke-width: 1.5;
        rx: 8;
        ry: 8;
      }
      .label {
        font-family: "Noto Sans CJK JP", "Hiragino Sans", sans-serif;
        font-size: 22px;
        fill: #222222;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .left {
        text-anchor: start;
      }
      .small {
        font-size: 18px;
      }
      .mini {
        font-size: 16px;
      }
      .note {
        font-family: "Noto Sans CJK JP", "Hiragino Sans", sans-serif;
        font-size: 17px;
        fill: #333333;
      }
      .line {
        stroke: #444444;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
      }
      .softline {
        stroke: #888888;
        stroke-width: 2.5;
        fill: none;
        marker-end: url(#arrow);
      }
      .speed-fast {
        fill: #4b7a31;
      }
      .speed-slow {
        fill: #9a6a2d;
      }
      .capacity-small {
        fill: #7cb66a;
      }
      .capacity-large {
        fill: #d9a55f;
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1078" height="858" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>

  <text class="title" x="36" y="42">レジスタとメモリの違い</text>
  <text class="subtitle" x="36" y="68">CPU の手元で即座に使う場所がレジスタ、</text>
  <text class="subtitle" x="36" y="92">外側で大量に保持する場所がメモリ</text>

  <rect class="panel" x="48" y="96" width="984" height="722"/>

  <rect class="box cpu" x="110" y="165" width="430" height="430"/>
  <text class="label" x="325" y="198">CPU の内側</text>
  <text class="label small" x="325" y="226">計算と制御が進む場所</text>

  <rect class="box reg" x="165" y="265" width="320" height="240"/>
  <text class="label" x="325" y="300">レジスタ</text>
  <text class="label small" x="325" y="336">CPU の内部にある</text>
  <text class="label small" x="325" y="366">ごく小さいが非常に高速</text>

  <rect class="smallbox" x="195" y="402" width="260" height="74"/>
  <text class="label small" x="325" y="428">いま実行中の処理で</text>
  <text class="label small" x="325" y="454">直ちに使う</text>

  <rect class="smallbox" x="165" y="522" width="320" height="74"/>
  <text class="label small" x="325" y="548">例: 計算途中の値、アドレス、状態</text>
  <text class="label mini" x="325" y="576">セグメントの基準や制御情報</text>

  <rect class="smallbox" x="590" y="165" width="340" height="430"/>
  <text class="label" x="760" y="198">メモリの側</text>
  <text class="label small" x="760" y="226">CPU の外側にある作業領域</text>

  <rect class="box mem" x="640" y="278" width="240" height="240"/>
  <text class="label" x="760" y="313">メモリ</text>
  <text class="label small" x="760" y="349">容量は大きい</text>
  <text class="label small" x="760" y="379">ただしレジスタより遅い</text>

  <rect class="smallbox" x="660" y="415" width="200" height="74"/>
  <text class="label small" x="760" y="441">大量のデータを</text>
  <text class="label small" x="760" y="467">保持する</text>

  <rect class="smallbox" x="610" y="535" width="300" height="74"/>
  <text class="label small" x="760" y="561">例: コード、配列、ヒープ、スタック</text>
  <text class="label mini" x="760" y="589">ページテーブルや各種データ構造</text>

  <line class="softline" x1="485" y1="392" x2="640" y2="392"/>
  <text class="note" x="520" y="370">必要なデータを読む</text>
  <line class="softline" x1="640" y1="448" x2="485" y2="448"/>
  <text class="note" x="520" y="480">処理結果を書き戻す</text>

  <rect class="smallbox" x="125" y="638" width="390" height="76"/>
  <text class="label small" x="320" y="664">要点: レジスタは</text>
  <text class="label small" x="320" y="692">CPU の手元の作業台</text>

  <rect class="smallbox" x="565" y="638" width="390" height="76"/>
  <text class="label small" x="760" y="664">要点: メモリは</text>
  <text class="label small" x="760" y="692">大量のデータを置く保管場所</text>

  <text class="note" x="122" y="782">このあと出てくるセグメントレジスタは、CPU の手元で</text>
  <text class="note" x="122" y="806">「どの基準でアドレスを読むか」を保持する特別なレジスタです。</text>

  <text class="label left small" x="185" y="110">速度</text>
  <rect x="235" y="98" width="220" height="16" rx="8" ry="8" fill="#ddebd7"/>
  <rect class="speed-fast" x="235" y="98" width="195" height="16" rx="8" ry="8"/>
  <text class="label left mini" x="465" y="110">速い</text>

  <text class="label left small" x="630" y="110">容量</text>
  <rect x="680" y="98" width="220" height="16" rx="8" ry="8" fill="#f3e1c7"/>
  <rect class="capacity-large" x="680" y="98" width="198" height="16" rx="8" ry="8"/>
  <text class="label left mini" x="910" y="110">大きい</text>

  <text class="label left small" x="185" y="132">容量</text>
  <rect x="235" y="120" width="220" height="16" rx="8" ry="8" fill="#ddebd7"/>
  <rect class="capacity-small" x="235" y="120" width="52" height="16" rx="8" ry="8"/>
  <text class="label left mini" x="465" y="132">小さい</text>

  <text class="label left small" x="630" y="132">速度</text>
  <rect x="680" y="120" width="220" height="16" rx="8" ry="8" fill="#f3e1c7"/>
  <rect class="speed-slow" x="680" y="120" width="78" height="16" rx="8" ry="8"/>
  <text class="label left mini" x="910" y="132">遅い</text>
</svg>