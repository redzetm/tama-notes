<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">ソースコード、実行ファイル、プロセスの関係図</title>
  <desc id="desc">ソースコードからコンパイルとリンクを経て実行ファイルができ、その同じ実行ファイルから複数のプロセスを起動できることを示す図</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef8ef"/>
    </linearGradient>
    <linearGradient id="panelSource" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff6d9"/>
      <stop offset="100%" stop-color="#ffe8b7"/>
    </linearGradient>
    <linearGradient id="panelExe" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#dff1ff"/>
      <stop offset="100%" stop-color="#c7e4ff"/>
    </linearGradient>
    <linearGradient id="panelProc" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#e9f7e4"/>
      <stop offset="100%" stop-color="#d3efc9"/>
    </linearGradient>
    <style>
      .base { font-family: "Noto Sans CJK JP", "Yu Gothic", sans-serif; fill: #223; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 17px; font-weight: 600; }
      .label { font-size: 20px; font-weight: 700; }
      .text { font-size: 15px; }
      .small { font-size: 14px; }
      .box { stroke: #314257; stroke-width: 2; rx: 16; ry: 16; }
      .cell { fill: #fff; stroke: #314257; stroke-width: 1.8; rx: 10; ry: 10; }
      .arrow { stroke: #455a74; stroke-width: 3; fill: none; }
      .note { fill: #fff4da; stroke: #c07a08; stroke-width: 2; rx: 14; ry: 14; }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#455a74"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="url(#bg)"/>

  <text x="48" y="52" class="base title">ソースコード、実行ファイル、プロセスは別物</text>
  <text x="48" y="82" class="base subtitle">編集するテキスト、保存された機械語ファイル、実行中インスタンスを分けて見る</text>

  <rect x="40" y="130" width="230" height="220" fill="url(#panelSource)" class="box"/>
  <text x="60" y="165" class="base label">ソースコード</text>
  <text x="60" y="190" class="base small">人間が編集するテキスト</text>
  <rect x="60" y="220" width="190" height="92" class="cell"/>
  <text x="80" y="255" class="base text">main.c</text>
  <text x="80" y="281" class="base text">printf("hello\n");</text>

  <rect x="375" y="130" width="230" height="220" fill="url(#panelExe)" class="box"/>
  <text x="395" y="165" class="base label">実行ファイル</text>
  <text x="395" y="190" class="base small">コンパイル、リンク後のファイル</text>
  <rect x="395" y="220" width="190" height="92" class="cell"/>
  <text x="415" y="255" class="base text">a.out</text>
  <text x="415" y="281" class="base text">ELF 形式の機械語など</text>

  <rect x="710" y="130" width="230" height="255" fill="url(#panelProc)" class="box"/>
  <text x="730" y="165" class="base label">プロセス</text>
  <text x="730" y="190" class="base small">実行中インスタンス</text>
  <rect x="730" y="220" width="190" height="42" class="cell"/>
  <text x="750" y="247" class="base text">PID 1201</text>
  <rect x="730" y="275" width="190" height="42" class="cell"/>
  <text x="750" y="302" class="base text">PID 1208</text>
  <rect x="730" y="330" width="190" height="42" class="cell"/>
  <text x="750" y="357" class="base text">PID 1215</text>

  <line x1="270" y1="240" x2="375" y2="240" class="arrow" marker-end="url(#arrowHead)"/>
  <line x1="605" y1="240" x2="710" y2="240" class="arrow" marker-end="url(#arrowHead)"/>
  <line x1="605" y1="290" x2="710" y2="290" class="arrow" marker-end="url(#arrowHead)"/>
  <line x1="605" y1="340" x2="710" y2="340" class="arrow" marker-end="url(#arrowHead)"/>

  <text x="292" y="214" class="base small">コンパイル</text>
  <text x="297" y="232" class="base small">+ リンク</text>
  <text x="632" y="223" class="base small">起動</text>
  <text x="632" y="273" class="base small">起動</text>
  <text x="632" y="323" class="base small">起動</text>

  <rect x="40" y="410" width="900" height="108" class="note"/>
  <text x="62" y="444" class="base text">重要: ソースコードを編集しても、すでに起動中のプロセスが自動で書き換わるわけではない。</text>
  <text x="62" y="470" class="base text">また同じ実行ファイルから複数のプロセスを起動できるので、実行ファイル 1 個とプロセス 1 個は同一視できない。</text>
  <text x="62" y="496" class="base small">研究では「いま見ているのはテキストか、保存済みバイナリか、実行中インスタンスか」を言い分けるのが重要。</text>
</svg>