<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <style>
      .box {
        fill: #f7f7f7;
        stroke: #333333;
        stroke-width: 2;
        rx: 6;
        ry: 6;
        filter: url(#shadow);
      }
      .node {
        fill: #ffffff;
        stroke: #333333;
        stroke-width: 2;
        filter: url(#shadow);
      }
      .line {
        stroke: #333333;
        stroke-width: 2;
      }
      .label {
        font-family: "Noto Sans CJK JP", "Hiragino Sans", sans-serif;
        font-size: 20px;
        text-anchor: middle;
        dominant-baseline: middle;
        fill: #222222;
      }
      .small {
        font-size: 18px;
      }
      .dots {
        font-size: 24px;
      }
    </style>
  </defs>

  <rect x="1" y="1" width="718" height="298" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>

  <line class="line" x1="360" y1="52" x2="140" y2="110"/>
  <line class="line" x1="360" y1="52" x2="280" y2="110"/>
  <line class="line" x1="360" y1="52" x2="430" y2="110"/>
  <line class="line" x1="360" y1="52" x2="580" y2="110"/>

  <line class="line" x1="140" y1="130" x2="90" y2="205"/>
  <line class="line" x1="140" y1="130" x2="190" y2="205"/>
  <line class="line" x1="430" y1="130" x2="390" y2="205"/>
  <line class="line" x1="430" y1="130" x2="490" y2="205"/>

  <rect class="box" x="320" y="20" width="80" height="32"/>
  <text class="label" x="360" y="36">/</text>

  <rect class="box" x="95" y="98" width="90" height="32"/>
  <text class="label" x="140" y="114">dev</text>

  <text class="label dots" x="220" y="114">…</text>

  <rect class="box" x="250" y="98" width="90" height="32"/>
  <text class="label" x="295" y="114">home</text>

  <text class="label dots" x="370" y="114">…</text>

  <rect class="box" x="385" y="98" width="90" height="32"/>
  <text class="label" x="430" y="114">bin</text>

  <text class="label dots" x="510" y="114">…</text>

  <rect class="box" x="535" y="98" width="90" height="32"/>
  <text class="label" x="580" y="114">usr</text>

  <circle class="node" cx="90" cy="225" r="26"/>
  <text class="label small" x="90" y="225">fd0</text>

  <text class="label dots" x="140" y="225">…</text>

  <circle class="node" cx="190" cy="225" r="26"/>
  <text class="label small" x="190" y="225">hda</text>

  <text class="label dots" x="295" y="210">…</text>

  <circle class="node" cx="390" cy="225" r="26"/>
  <text class="label small" x="390" y="225">ls</text>

  <text class="label dots" x="440" y="225">…</text>

  <circle class="node" cx="490" cy="225" r="26"/>
  <text class="label small" x="490" y="225">cp</text>

  <text class="label dots" x="580" y="210">…</text>
</svg>